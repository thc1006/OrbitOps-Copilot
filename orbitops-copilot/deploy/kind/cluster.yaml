kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: orbitops
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP   # Prometheus
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP   # Grafana
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
# Verify before install (2026-04-30):
#   kind v0.31.0;  default node image pinned by `kind version` at install time.
#   kubectl: v1.35.4 (n-1 of 1.36.0).
