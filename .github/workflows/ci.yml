name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Single source of truth for tooling versions used across multiple jobs.
# Bumping ruff here updates both the verify job and the dedicated lint-only
# job — keeps lint output identical no matter which job is consulted.
env:
  RUFF_VERSION: "0.15.12"

jobs:
  verify:
    name: verify (lint + schema + secrets + manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: bootstrap python
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # Tooling not pinned per-service. ruff pinned via workflow env so
          # this job and the dedicated `lint-only` job below report identically.
          .venv/bin/pip install "ruff==${RUFF_VERSION}" pytest jsonschema pyyaml
          # Install each Python service in editable mode so its declared
          # runtime deps (fastapi, pydantic, prometheus-client, httpx)
          # land in the venv. Without this, test.sh hits
          # `ModuleNotFoundError: No module named 'fastapi'` on import.
          .venv/bin/pip install \
            -e services/scenario-generator \
            -e services/ntn-metrics-emulator \
            -e services/copilot-api
      - name: install kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
      - name: install kubeconform
        # Offline schema validator. Replaces `kubectl apply --dry-run=client`,
        # which (kubectl 1.35.x) requires apiserver discovery for resource-type
        # recognition even with `--validate=false` — broken on a CI runner with
        # no cluster.
        run: |
          curl -sLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: install helm
        # PR #47 deep /review Tier C — without this, verify.sh's helm gate
        # silently skips in CI (warn-only), and chart breakage stays invisible.
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: chmod +x scripts
        run: chmod +x verify.sh test.sh scripts/*.sh
      - name: ./verify.sh
        run: |
          source .venv/bin/activate
          ./verify.sh

  lint-only:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check services/ scripts/ tests/ || true

  no-secrets:
    name: anonymity / secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/check-no-secrets.sh
      - run: scripts/check-no-secrets.sh

  schema-validate:
    name: schema validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install jsonschema
      - run: python scripts/validate_schemas.py

  k8s-manifest:
    name: k8s manifest validate (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
      - name: install kubeconform
        # Offline schema validator (replaces kubectl apply --dry-run=client,
        # which kubectl 1.35.x cannot run without an apiserver). kubeconform
        # also parses YAML structurally, so no separate yaml-parse step needed.
        run: |
          curl -sLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - run: |
          if [ -f deploy/k8s/overlays/local/kustomization.yaml ]; then
            kustomize build --load-restrictor=LoadRestrictionsNone deploy/k8s/overlays/local > /tmp/render.yaml
            kubeconform -strict -summary /tmp/render.yaml
          else
            echo "k8s overlay not yet present (Sprint 0); will tighten in Sprint 1."
          fi

  docker-build:
    name: docker compose build (emulator + copilot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose config
        # Catches malformed YAML, undeclared volumes, dangling depends_on,
        # and missing build contexts.
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: build ntn-metrics-emulator
        # Real build — locks in the PR #23 fix (build context = repo root,
        # `COPY tests/contracts` must resolve). Without this gate the previous
        # broken `COPY ../../tests/contracts` could regress invisibly and
        # only surface at the first live demo.
        run: docker compose -f deploy/docker-compose.yml build ntn-metrics-emulator
      - name: build copilot-api
        run: docker compose -f deploy/docker-compose.yml build copilot-api

  tdd-discipline:
    # Phase B (chore/tdd-discipline-blocking) — closes docs/reviews/issues.md
    # I-3. Blocking on `pull_request` only; runs scripts/check-tdd-discipline.sh
    # in --mode=blocking against the PR's commit range vs base branch. Fails
    # when a PR touches services/**/*.py|.ts|.tsx without a `red(...)`-tagged
    # commit ancestor (and without [skip-tdd] escape).
    name: tdd discipline (red→green history)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so `git log $BASE..HEAD` and `git diff $BASE..HEAD`
          # see the full PR commit range, not just the merge commit.
          fetch-depth: 0
      - name: chmod +x
        run: chmod +x scripts/check-tdd-discipline.sh tests/unit/test_check_tdd_discipline.sh
      - name: self-test of the gate
        # Without this, a regex regression in the gate could silently flip
        # the gate's polarity and either let bad PRs through or block
        # legitimate work. Self-test runs first so a broken gate fails CI
        # before it ever touches the PR's actual history.
        run: ./tests/unit/test_check_tdd_discipline.sh
      - name: blocking check on PR commit range
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
          BRANCH: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-tdd-discipline.sh --mode=blocking

  ui-build:
    # Phase H Tier 3.A — without this job, regressions in the UI (TypeScript
    # errors, vitest failures, broken vite build) only surface on a developer's
    # local box. Pre-existing tech debt called out in the 2026-05-02
    # ultrathink project inventory (M1).
    name: ui build + tests (digital-twin-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/digital-twin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/digital-twin-ui/package-lock.json
      - name: install
        run: npm ci
      - name: vitest
        # Vitest covers App routing, MetricNumber + StatusChip components,
        # api.ts parser + computeBeams, and the Scenarios + Beams + Anomalies
        # + Copilot page rendering contracts.
        run: npm run test
      - name: vite build (includes tsc --noEmit)
        # `npm run build` is `tsc --noEmit && vite build` per package.json,
        # so this single step covers BOTH typecheck and bundle — no separate
        # typecheck step needed (PR #46 bot review #46-5: dedupe).
        run: npm run build
