name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Single source of truth for tooling versions used across multiple jobs.
# Bumping ruff here updates both the verify job and the dedicated lint-only
# job — keeps lint output identical no matter which job is consulted.
env:
  RUFF_VERSION: "0.15.12"

jobs:
  verify:
    name: verify (lint + schema + secrets + manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: bootstrap python
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # Tooling not pinned per-service. ruff pinned via workflow env so
          # this job and the dedicated `lint-only` job below report identically.
          .venv/bin/pip install "ruff==${RUFF_VERSION}" pytest jsonschema pyyaml
          # Install each Python service in editable mode so its declared
          # runtime deps (fastapi, pydantic, prometheus-client, httpx)
          # land in the venv. Without this, test.sh hits
          # `ModuleNotFoundError: No module named 'fastapi'` on import.
          .venv/bin/pip install \
            -e services/scenario-generator \
            -e services/ntn-metrics-emulator \
            -e services/copilot-api
      - name: install kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
      - name: install kubeconform
        # Offline schema validator. Replaces `kubectl apply --dry-run=client`,
        # which (kubectl 1.35.x) requires apiserver discovery for resource-type
        # recognition even with `--validate=false` — broken on a CI runner with
        # no cluster.
        run: |
          curl -sLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: chmod +x scripts
        run: chmod +x verify.sh test.sh scripts/*.sh
      - name: ./verify.sh
        run: |
          source .venv/bin/activate
          ./verify.sh

  lint-only:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check services/ scripts/ tests/ || true

  no-secrets:
    name: anonymity / secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/check-no-secrets.sh
      - run: scripts/check-no-secrets.sh

  schema-validate:
    name: schema validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install jsonschema
      - run: python scripts/validate_schemas.py

  k8s-manifest:
    name: k8s manifest validate (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
      - name: install kubeconform
        # Offline schema validator (replaces kubectl apply --dry-run=client,
        # which kubectl 1.35.x cannot run without an apiserver). kubeconform
        # also parses YAML structurally, so no separate yaml-parse step needed.
        run: |
          curl -sLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - run: |
          if [ -f deploy/k8s/overlays/local/kustomization.yaml ]; then
            kustomize build --load-restrictor=LoadRestrictionsNone deploy/k8s/overlays/local > /tmp/render.yaml
            kubeconform -strict -summary /tmp/render.yaml
          else
            echo "k8s overlay not yet present (Sprint 0); will tighten in Sprint 1."
          fi

  docker-build:
    name: docker compose build (emulator + copilot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose config
        # Catches malformed YAML, undeclared volumes, dangling depends_on,
        # and missing build contexts.
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: build ntn-metrics-emulator
        # Real build — locks in the PR #23 fix (build context = repo root,
        # `COPY tests/contracts` must resolve). Without this gate the previous
        # broken `COPY ../../tests/contracts` could regress invisibly and
        # only surface at the first live demo.
        run: docker compose -f deploy/docker-compose.yml build ntn-metrics-emulator
      - name: build copilot-api
        run: docker compose -f deploy/docker-compose.yml build copilot-api
