[project]
name = "copilot-api"
version = "0.0.1.dev0"
description = "OrbitOps evidence-grounded LLM copilot API (Sprint 0 skeleton)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136",
  "uvicorn>=0.46",
  "pydantic>=2.13",
  "httpx>=0.28",
  "prometheus-client>=0.25",
  # G6 — exposes /metrics for the Prom scrape job in
  # deploy/k8s/base/prometheus-configmap.yaml.
  "prometheus-fastapi-instrumentator>=7.0,<8.0",
  # VS-19: OIDC/JWT auth. Pin >=2.12.1 — CVE-2026-32597 (CVSS 7.5) fix.
  # [crypto] extra pulls in cryptography for RSA key parsing (from_jwk).
  "PyJWT[crypto]>=2.12.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
