[project]
name = "scenario-generator"
version = "0.0.1.dev0"
description = "OrbitOps NTN scenario generator (Sprint 0 skeleton)."
requires-python = ">=3.11"
dependencies = [
  # Sprint 1 currently builds scenarios as raw dicts validated by JSON Schema.
  # Add pydantic when type-safe domain objects land (planned for Sprint 2).
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
