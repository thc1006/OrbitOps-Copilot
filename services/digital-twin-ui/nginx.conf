# services/digital-twin-ui/nginx.conf — minimal SPA + healthz config.
#
# Mounted at /etc/nginx/conf.d/default.conf inside the container.

server {
    listen 80;
    server_name _;

    # k8s liveness/readiness probe target. Returns 200 immediately; cheaper
    # than serving index.html for every probe tick.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain";
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any unmatched path returns index.html so React Router
    # (when added) can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
