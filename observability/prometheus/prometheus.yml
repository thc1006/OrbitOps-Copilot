global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: orbitops-copilot

scrape_configs:
  # Primary scrape target: NTN metrics emulator emits orbitops_beam_snr_db,
  # orbitops_link_latency_ms, orbitops_packet_loss_ratio, orbitops_doppler_residual_hz,
  # orbitops_handover_state, orbitops_gateway_available, orbitops_anomaly_active.
  - job_name: ntn-metrics-emulator
    metrics_path: /metrics
    static_configs:
      - targets:
          - "ntn-metrics-emulator:8000"
        labels:
          service: ntn-metrics-emulator

  # copilot-api self-metrics (request count, status distribution, etc).
  # Sprint 1: copilot-api does not yet emit /metrics; included as a forward
  # placeholder so that adding instrumentation in Sprint 2 is zero-config.
  - job_name: copilot-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - "copilot-api:8001"
        labels:
          service: copilot-api

  # Self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: prometheus
