apiVersion: v1
kind: ConfigMap
metadata:
  name: orbitops-loki-config
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: orbitops-copilot
data:
  # Mirrors observability/loki/local-config.yaml (compose path) — single
  # binary, filesystem storage, no auth. LOCAL-DEMO ONLY. Production
  # would use object storage + auth.
  local-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 24h
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 6

    ruler:
      alertmanager_url: ""
