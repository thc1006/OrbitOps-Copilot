apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-api
  labels:
    app.kubernetes.io/name: copilot-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-api
    spec:
      containers:
        - name: copilot
          image: orbitops/copilot-api:0.1.2-dev-sprint2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: COPILOT_LLM_PROVIDER
              value: "mock"
            - name: ORBITOPS_EMULATOR_METRICS_URL
              # Bare hostname uses kubernetes' DNS search-domain expansion
              # to resolve `<svc>` → `<svc>.<pod-ns>.svc.cluster.local`,
              # which means an overlay that deploys the stack into a
              # non-default namespace continues to work without patching.
              value: "http://ntn-metrics-emulator:8000/metrics"
            - name: CORS_ALLOWED_ORIGINS
              # Local NodePort overlay only; tighten before any ingress deploy.
              # Vite dev server (localhost:5173) included so contributors can
              # run `npm run dev` against the in-cluster copilot directly.
              value: "http://localhost:5173,http://localhost:30073,http://31.41.34.19:30073"
            - name: ORBITOPS_LOKI_URL
              # PR #60 / D2 (2026-05-03) intended to add this — but the
              # edit didn't actually land in main (caught by U7 fix on
              # 2026-05-04). Bare hostname `loki` resolves via K8s DNS
              # to the Loki Service in this namespace. With this env
              # var set, copilot-api's _log_retrieval.LokiLogScraper
              # queries Loki for /ask evidence augmentation; without
              # it, NullLogScraper fallback yields evidence.logs_used=[].
              value: "http://loki:3100"
