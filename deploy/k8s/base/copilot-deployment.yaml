apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-api
  labels:
    app.kubernetes.io/name: copilot-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-api
    spec:
      containers:
        - name: copilot
          image: orbitops/copilot-api:0.1.0-dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: COPILOT_LLM_PROVIDER
              value: "mock"
            - name: ORBITOPS_EMULATOR_METRICS_URL
              value: "http://ntn-metrics-emulator:8000/metrics"
