apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-api
  labels:
    app.kubernetes.io/name: copilot-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-api
    spec:
      containers:
        - name: copilot
          image: orbitops/copilot-api:0.1.1-dev-g6g7g8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: COPILOT_LLM_PROVIDER
              value: "mock"
            - name: ORBITOPS_EMULATOR_METRICS_URL
              # Bare hostname uses kubernetes' DNS search-domain expansion
              # to resolve `<svc>` → `<svc>.<pod-ns>.svc.cluster.local`,
              # which means an overlay that deploys the stack into a
              # non-default namespace continues to work without patching.
              value: "http://ntn-metrics-emulator:8000/metrics"
            - name: CORS_ALLOWED_ORIGINS
              # Local NodePort overlay only; tighten before any ingress deploy.
              # Vite dev server (localhost:5173) included so contributors can
              # run `npm run dev` against the in-cluster copilot directly.
              value: "http://localhost:5173,http://localhost:30073,http://31.41.34.19:30073"
