apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbitops-alloy
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: orbitops-copilot
---
# RBAC: Alloy needs read access to pods/log discovery in the orbitops
# namespace so loki.source.kubernetes can tail container logs via the
# K8s API. NO cluster-wide reads; namespace-scoped Role only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orbitops-alloy
  labels:
    app.kubernetes.io/name: alloy
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orbitops-alloy
  labels:
    app.kubernetes.io/name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orbitops-alloy
subjects:
  - kind: ServiceAccount
    name: orbitops-alloy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: orbitops-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: orbitops-copilot
    spec:
      serviceAccountName: orbitops-alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.6.1
          imagePullPolicy: IfNotPresent
          args:
            - "run"
            - "/etc/alloy/config.alloy"
            - "--server.http.listen-addr=0.0.0.0:12345"
            - "--storage.path=/var/lib/alloy/data"
          ports:
            - containerPort: 12345
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
          resources:
            requests: { cpu: "20m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          livenessProbe:
            httpGet: { path: /-/healthy, port: 12345 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /-/ready, port: 12345 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: orbitops-alloy-config
        - name: data
          emptyDir:
            sizeLimit: 256Mi
