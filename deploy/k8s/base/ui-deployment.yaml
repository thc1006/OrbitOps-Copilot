apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-twin-ui
  labels:
    app.kubernetes.io/name: digital-twin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: digital-twin-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digital-twin-ui
    spec:
      containers:
        - name: ui
          image: orbitops/digital-twin-ui:0.1.0-dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
          # /healthz served by nginx.conf — cheaper than rendering index.html
          # on every probe tick. Aligned with services/digital-twin-ui/nginx.conf.
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: digital-twin-ui
  labels:
    app.kubernetes.io/name: digital-twin-ui
spec:
  selector:
    app.kubernetes.io/name: digital-twin-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
