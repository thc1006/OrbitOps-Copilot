apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntn-metrics-emulator
  labels:
    app.kubernetes.io/name: ntn-metrics-emulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntn-metrics-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntn-metrics-emulator
    spec:
      containers:
        - name: emulator
          image: orbitops/ntn-metrics-emulator:v0.1.4-dev-sprint4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: ORBITOPS_SCENARIO_PATH
              value: "/scenarios/beam-degradation.json"
            - name: CORS_ALLOWED_ORIGINS
              # Local NodePort overlay only; tighten before any ingress deploy.
              value: "http://localhost:5173,http://localhost:30073,http://31.41.34.19:30073"
          volumeMounts:
            - name: scenarios
              mountPath: /scenarios
              readOnly: true
      volumes:
        - name: scenarios
          configMap:
            name: orbitops-scenarios
