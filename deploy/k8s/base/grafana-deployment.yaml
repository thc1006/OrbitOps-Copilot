apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: orbitops-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: orbitops-copilot
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.3
          imagePullPolicy: IfNotPresent
          env:
            # ⚠ Sprint 1 demo defaults: hard-coded admin/admin + anonymous
            # Viewer role. SAFE ONLY for the local-overlay deploy
            # (NodePorts only reachable on the dev box).
            #
            # Sprint 2 hardening (tracked in docs/reviews/security-review.md
            # S-3): move admin creds to a `grafana-admin` Secret and gate
            # GF_AUTH_ANONYMOUS_ENABLED=true behind the local overlay only
            # (envFrom secretRef + overlay patch flipping anonymous off in
            # any non-local context).
            - { name: GF_SECURITY_ADMIN_USER,         value: "admin" }
            - { name: GF_SECURITY_ADMIN_PASSWORD,     value: "admin" }
            - { name: GF_USERS_ALLOW_SIGN_UP,         value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED,      value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE,     value: "Viewer" }
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: provisioning-datasources
          configMap:
            name: orbitops-grafana-provisioning
            items:
              - key: datasource.yaml
                path: prometheus.yaml
        - name: provisioning-dashboards
          configMap:
            name: orbitops-grafana-provisioning
            items:
              - key: dashboard-provider.yaml
                path: orbitops.yaml
        - name: dashboards
          # Generated by kustomize configMapGenerator from
          # observability/grafana/dashboards/*.json — see kustomization.yaml.
          configMap:
            name: orbitops-grafana-dashboards
        - name: data
          # Sprint 1 demo: emptyDir is fine. PVC for any persistent setup.
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: orbitops-copilot
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
