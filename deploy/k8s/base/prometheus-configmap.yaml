apiVersion: v1
kind: ConfigMap
metadata:
  name: orbitops-prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: orbitops-copilot
data:
  prometheus.yml: |
    # k8s flavour of observability/prometheus/prometheus.yml — only the
    # scrape targets differ (k8s in-cluster DNS instead of compose hostname).
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        monitor: orbitops-copilot
        deployment: kubernetes

    scrape_configs:
      # Primary scrape target — emits the seven orbitops_* metrics.
      - job_name: ntn-metrics-emulator
        metrics_path: /metrics
        static_configs:
          - targets:
              - "ntn-metrics-emulator.orbitops.svc.cluster.local:8000"
            labels:
              service: ntn-metrics-emulator

      # G6 — copilot-api self-metrics (HTTP RED — request-rate, errors,
      # duration). Wired via prometheus-fastapi-instrumentator 7.x.
      - job_name: copilot-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - "copilot-api.orbitops.svc.cluster.local:8001"
            labels:
              service: copilot-api

      # Self-monitoring.
      - job_name: prometheus
        static_configs:
          - targets:
              - "localhost:9090"
            labels:
              service: prometheus
