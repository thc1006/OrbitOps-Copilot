# Template — the Secret itself MUST be created out-of-band before
# applying this overlay. The data here is a placeholder so kustomize
# render doesn't error; the live secret is operator-managed:
#
#   kubectl create secret generic orbitops-grafana-admin \
#     -n orbitops \
#     --from-literal=password="$(openssl rand -base64 32)"
#
# The placeholder password "REPLACE_ME_BEFORE_DEPLOY" is intentionally
# obvious so it shows up in diffs, secret-scanning tools, and
# `kubectl get secret -o yaml` outputs as a red flag.
apiVersion: v1
kind: Secret
metadata:
  name: orbitops-grafana-admin
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: orbitops-copilot
type: Opaque
stringData:
  password: "REPLACE_ME_BEFORE_DEPLOY"
