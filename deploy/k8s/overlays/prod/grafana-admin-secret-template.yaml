# Reference template ONLY — NOT applied by kustomize.
#
# This file is intentionally NOT in kustomization.yaml's `resources:`
# list (PR #63 review feedback, 2026-05-04). Applying it would clobber
# the operator-managed real Secret with a placeholder password.
#
# Operator creates the real Secret out-of-band BEFORE running
# `kubectl apply -k deploy/k8s/overlays/prod`:
#
#   kubectl create secret generic orbitops-grafana-admin \
#     -n orbitops \
#     --from-literal=password="$(openssl rand -base64 32)"
#
# The placeholder "REPLACE_ME_BEFORE_DEPLOY" below is deliberately
# obvious — if you ever see it in `kubectl get secret -o yaml`, that
# means somebody added this file back to `resources` by mistake.
apiVersion: v1
kind: Secret
metadata:
  name: orbitops-grafana-admin
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: orbitops-copilot
type: Opaque
stringData:
  password: "REPLACE_ME_BEFORE_DEPLOY"
