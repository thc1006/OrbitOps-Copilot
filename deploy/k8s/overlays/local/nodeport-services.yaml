# Local-only: expose services via NodePort so kind extraPortMappings can
# reach the host. NEVER use this overlay against a non-local cluster — base
# services are ClusterIP for production safety.
apiVersion: v1
kind: Service
metadata:
  name: ntn-metrics-emulator-nodeport
  labels:
    app.kubernetes.io/name: ntn-metrics-emulator
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ntn-metrics-emulator
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
---
