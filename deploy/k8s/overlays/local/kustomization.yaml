apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orbitops
resources:
  - ../../base
  - nodeport-services.yaml
patches:
  - target:
      kind: Deployment
      name: ntn-metrics-emulator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: copilot-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
