# VS-19: Mock OIDC server (navikt/mock-oauth2-server) for local JWT auth testing.
# Provides JWKS endpoint at http://mock-oidc:9090/orbitops/jwks (ClusterIP).
# copilot-api fetches this at startup to validate RS256 JWT tokens.
# Developer access via:  kubectl port-forward svc/mock-oidc 9091:9090 -n orbitops
#
# No NodePort — per CLAUDE.md hard rule "No NodePort to public networks".
# For host access use port-forward as shown above.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oidc
  labels:
    app.kubernetes.io/name: mock-oidc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-oidc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-oidc
    spec:
      containers:
        - name: mock-oidc
          image: ghcr.io/navikt/mock-oauth2-server:2.1.10
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: SERVER_PORT
              value: "9090"
            - name: JSON_CONFIG
              value: |
                {
                  "interactiveLogin": false,
                  "httpServer": "NettyWrapper",
                  "tokenCallbacks": [
                    {
                      "issuerId": "orbitops",
                      "tokenExpiry": 3600,
                      "requestMappings": [
                        {
                          "requestParam": "grant_type",
                          "match": "client_credentials",
                          "claims": {
                            "sub": "orbitops-service",
                            "aud": "orbitops-copilot"
                          }
                        }
                      ]
                    }
                  ]
                }
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /orbitops/.well-known/openid-configuration
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /orbitops/.well-known/openid-configuration
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mock-oidc
  labels:
    app.kubernetes.io/name: mock-oidc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-oidc
  ports:
    - name: http
      port: 9090
      targetPort: 9090
