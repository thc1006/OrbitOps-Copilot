# OrbitOps Copilot — local dev compose for VS-2 observability slice.
#
# Brings up: ntn-metrics-emulator + copilot-api + prometheus + grafana
# + loki + alloy + (profile-gated) digital-twin-ui.
# Pinned to 2026-05-03 stable: Prom v3.11.3 (CVE-2025-13465+12816 fix
# vs 3.5.0), Grafana 11.4.3 (CVE-2025-3260 fix), Alloy 1.6.1 (replaces
# EOL promtail per ADR-010).
#
# Quick-start (from repo root):
#   docker compose -f deploy/docker-compose.yml up -d
#   curl http://localhost:8000/healthz   # emulator
#   curl http://localhost:8001/healthz   # copilot
#   open http://localhost:9090           # prometheus
#   open http://localhost:3000           # grafana (admin/admin)

services:
  ntn-metrics-emulator:
    build:
      # Repo root: needed so the Dockerfile can COPY tests/contracts/ which lives
      # outside services/ntn-metrics-emulator/. Service-only context would error
      # with "forbidden path outside the build context" on `docker compose build`.
      context: ..
      dockerfile: services/ntn-metrics-emulator/Dockerfile
    image: orbitops/ntn-metrics-emulator:0.1.3-dev-sprint3
    container_name: orbitops-emulator
    ports:
      # Local-only by default. To expose on a shared host, override:
      #   COMPOSE_BIND=0.0.0.0 docker compose ... up
      - "${COMPOSE_BIND:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 5s
      timeout: 2s
      retries: 6

  copilot-api:
    build:
      # Repo root: matches the Dockerfile's `COPY services/copilot-api/...` paths.
      # Aligned with ntn-metrics-emulator (changed in PR #23) so both services
      # share a build-context convention.
      context: ..
      dockerfile: services/copilot-api/Dockerfile
    image: orbitops/copilot-api:0.1.3-dev-sprint3
    container_name: orbitops-copilot
    depends_on:
      ntn-metrics-emulator:
        condition: service_healthy
    ports:
      - "${COMPOSE_BIND:-127.0.0.1}:8001:8001"
    environment:
      COPILOT_LLM_PROVIDER: mock
      ORBITOPS_EMULATOR_METRICS_URL: http://ntn-metrics-emulator:8000/metrics

  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: orbitops-prometheus
    depends_on:
      - ntn-metrics-emulator
    ports:
      - "${COMPOSE_BIND:-127.0.0.1}:9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.3
    container_name: orbitops-grafana
    depends_on:
      - prometheus
      # Loki is auto-provisioned via observability/grafana/provisioning/
      # datasources/loki.yaml; depends_on makes sure Loki is up before
      # Grafana tries to validate the datasource on first boot.
      - loki
    ports:
      - "${COMPOSE_BIND:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  # VS-10b.1 (PR #56) added Loki + promtail. ADR-010 (2026-05-03)
  # retired promtail (EOL March 2026) in favor of Grafana Alloy. Loki
  # itself unchanged. Copilot's _log_retrieval.LokiLogScraper queries
  # Loki at http://loki:3100; LogQL `{service=~"orbitops-.*"}` filter
  # is shipper-agnostic.
  loki:
    image: grafana/loki:3.4.0
    container_name: orbitops-loki
    ports:
      - "${COMPOSE_BIND:-127.0.0.1}:3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped

  # ADR-010 (2026-05-03): Grafana Alloy replaces promtail. River-syntax
  # config in observability/alloy/config.alloy. Tails container stdout
  # via the docker socket; labels service=<container_name>; filters
  # to orbitops-* containers only (excludes Alloy's own logs from a
  # re-ingestion loop). Pinned to v1.6.1 (latest stable as of ADR date).
  alloy:
    image: grafana/alloy:v1.6.1
    container_name: orbitops-alloy
    depends_on:
      - loki
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
    volumes:
      # Read-only access to the docker socket (container metadata) and
      # the json-file log directory. Production deployments should
      # replace with Loki's HTTP push API or the docker-driver plugin
      # — this socket-mount pattern is local-demo only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    restart: unless-stopped

  # Sprint 1 UI — built from source; mock-mode when copilot-api unreachable.
  digital-twin-ui:
    profiles: ["ui"]
    image: nginx:alpine
    container_name: orbitops-ui
    depends_on:
      - copilot-api
    ports:
      - "${COMPOSE_BIND:-127.0.0.1}:5173:80"
    volumes:
      - ../services/digital-twin-ui/dist:/usr/share/nginx/html:ro
