global:
  namespace: orbitops

emulator:
  enabled: true
  image:
    repository: orbitops/ntn-metrics-emulator
    # 2026-05-05 bump: 0.1.2-dev-sprint2 → 0.1.3-dev-sprint3 syncs Helm tag with
    # the Kustomize base after Sprint-3 PR train (#62/#66 minor logging/review
    # changes). PR #35 first aligned this chart with the overlay; the parity
    # rule still holds.
    tag: "0.1.3-dev-sprint3"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8000
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  scenario:
    path: /scenarios/beam-degradation.json
    # ConfigMap is checked-in `deploy/k8s/base/scenario-configmap.yaml`
    # (kustomize `resources:`, NOT `configMapGenerator`). Not rendered by
    # this chart. Helm-only deploys must `kubectl apply -f` that file
    # (or render the kustomize base) before install.
    configMapName: orbitops-scenarios
  # CORS allowlist for browser calls into the emulator. Sprint-1 demo
  # default = local NodePort overlay (kubeadm InternalIP 31.41.34.19).
  # Override per-deployment for a different node IP / ingress hostname.
  corsAllowedOrigins: "http://localhost:5173,http://localhost:30073,http://31.41.34.19:30073"

copilot:
  enabled: true
  image:
    repository: orbitops/copilot-api
    tag: "0.1.3-dev-sprint3"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8001
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  llm:
    provider: mock
    openaiBaseUrl: ""
    openaiModel: ""
  # ADR-009: chart Service names mirror the Kustomize bare names, so this
  # default URL resolves correctly out of box. Bare hostname uses kubernetes'
  # DNS search-domain expansion to resolve `ntn-metrics-emulator` → the
  # Service in the same namespace, regardless of which namespace the chart
  # is installed into.
  emulatorMetricsUrl: "http://ntn-metrics-emulator:8000/metrics"
  corsAllowedOrigins: "http://localhost:5173,http://localhost:30073,http://31.41.34.19:30073"

# Phase H.2 — UI / Prometheus / Grafana templates added 2026-05-02 to bring
# the Helm chart in line with the Kustomize overlay (was drifted: chart only
# shipped emulator + copilot, while the overlay shipped 5 services).

ui:
  enabled: true
  image:
    repository: orbitops/digital-twin-ui
    # 2026-05-05 bump: 0.1.2-dev-sprint2 → 0.1.3-dev-sprint3 picks up the
    # Sprint-3 frontend train (PR #73-#82): Node 22 / Vite 8 / React 19 /
    # CesiumJS satellite-pass + beam cones / i18n broader coverage / tsconfig
    # noEmit. UI image was the largest drift item between live cluster and
    # main; this bump is what makes the demo's zh-TW + /satellite-view route
    # actually work in-cluster.
    tag: "0.1.3-dev-sprint3"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 80
  resources:
    requests: { cpu: "20m",  memory: "32Mi" }
    limits:   { cpu: "200m", memory: "128Mi" }

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v3.11.3
    pullPolicy: IfNotPresent
  service:
    port: 9090
  tsdbRetention: 24h
  dataSizeLimit: 1Gi
  # The chart does NOT render the Prometheus config ConfigMap. It's a
  # checked-in `deploy/k8s/base/prometheus-configmap.yaml` (kustomize
  # `resources:`, NOT `configMapGenerator`). For Helm-only deploys,
  # `kubectl apply -f` that file (or render the kustomize base) before
  # `helm install`. Sprint-2 may vendor the config into this chart.
  configMapName: orbitops-prometheus-config
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: 11.4.3
    pullPolicy: IfNotPresent
  service:
    port: 3000
  dataSizeLimit: 256Mi
  # Sprint-1 demo defaults — anonymous Viewer + admin/admin. SAFE ONLY for
  # the local-overlay deploy (see deploy/k8s/base/grafana-deployment.yaml
  # comment block). Sprint-2 hardening tracked at
  # docs/reviews/security-review.md S-3 (admin creds → Secret;
  # anonymous → off in non-local).
  admin:
    user: admin
    password: admin
  anonymous:
    enabled: true
    orgRole: Viewer
  # ConfigMaps:
  # - `orbitops-grafana-provisioning` — checked-in
  #   `deploy/k8s/base/grafana-configmap.yaml` (kustomize `resources:`).
  # - `orbitops-grafana-dashboards` — the only one actually
  #   `configMapGenerator`-backed (from `observability/grafana/dashboards/`).
  # Helm-only deploys must apply both before `helm install` (render the
  # kustomize base + `kubectl apply -f -`).
  configMaps:
    provisioning: orbitops-grafana-provisioning
    dashboards:   orbitops-grafana-dashboards
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "300m", memory: "256Mi" }

# D2 / ADR-010 (2026-05-03): Loki + Alloy K8s parity. Compose path
# already had these as of VS-10b.1 PR #56; this PR brings K8s + Helm
# in line. copilot-api's `_log_retrieval.LokiLogScraper` queries
# Loki at http://loki:3100 (env var ORBITOPS_LOKI_URL on copilot
# deployment); Alloy ships container logs into Loki via
# `loki.source.kubernetes` (RBAC: namespace-scoped pod/pods/log read).

loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: "3.4.0"
    pullPolicy: IfNotPresent
  service:
    port: 3100
  dataSizeLimit: 2Gi
  # Loki config is the checked-in `deploy/k8s/base/loki-configmap.yaml`
  # (kustomize `resources:`, NOT `configMapGenerator`).
  configMapName: orbitops-loki-config
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

alloy:
  enabled: true
  image:
    repository: grafana/alloy
    tag: "v1.6.1"
    pullPolicy: IfNotPresent
  # Config map carries the River-syntax pipeline (loki.source.kubernetes
  # → relabel → loki.write). Checked-in `deploy/k8s/base/alloy-
  # configmap.yaml` (kustomize `resources:`, NOT `configMapGenerator`).
  configMapName: orbitops-alloy-config
  resources:
    requests: { cpu: "20m",  memory: "64Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }
