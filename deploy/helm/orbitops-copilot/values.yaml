global:
  namespace: orbitops

emulator:
  enabled: true
  image:
    repository: orbitops/ntn-metrics-emulator
    # PR #35 bumped both emulator + copilot to this tag (G6/G7/G8 sprint-1 spec parity).
    # Helm chart was drifted at 0.0.1-dev pre-PR-G; aligned here.
    tag: "0.1.1-dev-g6g7g8"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8000
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  scenario:
    path: /scenarios/beam-degradation.json
    # ConfigMap is checked-in `deploy/k8s/base/scenario-configmap.yaml`
    # (kustomize `resources:`, NOT `configMapGenerator`). Not rendered by
    # this chart. Helm-only deploys must `kubectl apply -f` that file
    # (or render the kustomize base) before install.
    configMapName: orbitops-scenarios
  # CORS allowlist for browser calls into the emulator. Sprint-1 demo
  # default = local NodePort overlay (kubeadm InternalIP 31.41.34.19).
  # Override per-deployment for a different node IP / ingress hostname.
  corsAllowedOrigins: "http://localhost:5173,http://localhost:30073,http://31.41.34.19:30073"

copilot:
  enabled: true
  image:
    repository: orbitops/copilot-api
    tag: "0.1.1-dev-g6g7g8"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8001
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  llm:
    provider: mock
    openaiBaseUrl: ""
    openaiModel: ""
  # ADR-009: chart Service names mirror the Kustomize bare names, so this
  # default URL resolves correctly out of box. Bare hostname uses kubernetes'
  # DNS search-domain expansion to resolve `ntn-metrics-emulator` → the
  # Service in the same namespace, regardless of which namespace the chart
  # is installed into.
  emulatorMetricsUrl: "http://ntn-metrics-emulator:8000/metrics"
  corsAllowedOrigins: "http://localhost:5173,http://localhost:30073,http://31.41.34.19:30073"

# Phase H.2 — UI / Prometheus / Grafana templates added 2026-05-02 to bring
# the Helm chart in line with the Kustomize overlay (was drifted: chart only
# shipped emulator + copilot, while the overlay shipped 5 services).

ui:
  enabled: true
  image:
    repository: orbitops/digital-twin-ui
    # UI image was NOT bumped in PR #35 (no UI code changed in PR #34); the
    # Phase F UI button (PR #42) was rebuilt locally over 0.1.0-dev rather
    # than tag-bumped. Sprint-2 will revisit + may bump alongside Recharts.
    tag: "0.1.0-dev"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 80
  resources:
    requests: { cpu: "20m",  memory: "32Mi" }
    limits:   { cpu: "200m", memory: "128Mi" }

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v3.5.0
    pullPolicy: IfNotPresent
  service:
    port: 9090
  tsdbRetention: 24h
  dataSizeLimit: 1Gi
  # The chart does NOT render the Prometheus config ConfigMap. It's a
  # checked-in `deploy/k8s/base/prometheus-configmap.yaml` (kustomize
  # `resources:`, NOT `configMapGenerator`). For Helm-only deploys,
  # `kubectl apply -f` that file (or render the kustomize base) before
  # `helm install`. Sprint-2 may vendor the config into this chart.
  configMapName: orbitops-prometheus-config
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: 11.4.0
    pullPolicy: IfNotPresent
  service:
    port: 3000
  dataSizeLimit: 256Mi
  # Sprint-1 demo defaults — anonymous Viewer + admin/admin. SAFE ONLY for
  # the local-overlay deploy (see deploy/k8s/base/grafana-deployment.yaml
  # comment block). Sprint-2 hardening tracked at
  # docs/reviews/security-review.md S-3 (admin creds → Secret;
  # anonymous → off in non-local).
  admin:
    user: admin
    password: admin
  anonymous:
    enabled: true
    orgRole: Viewer
  # ConfigMaps:
  # - `orbitops-grafana-provisioning` — checked-in
  #   `deploy/k8s/base/grafana-configmap.yaml` (kustomize `resources:`).
  # - `orbitops-grafana-dashboards` — the only one actually
  #   `configMapGenerator`-backed (from `observability/grafana/dashboards/`).
  # Helm-only deploys must apply both before `helm install` (render the
  # kustomize base + `kubectl apply -f -`).
  configMaps:
    provisioning: orbitops-grafana-provisioning
    dashboards:   orbitops-grafana-dashboards
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "300m", memory: "256Mi" }
