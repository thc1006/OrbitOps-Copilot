global:
  namespace: orbitops

emulator:
  image:
    repository: orbitops/ntn-metrics-emulator
    # PR #35 bumped both emulator + copilot to this tag (G6/G7/G8 sprint-1 spec parity).
    # Helm chart was drifted at 0.0.1-dev pre-PR-G; aligned here.
    tag: "0.1.1-dev-g6g7g8"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8000
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  scenario:
    path: /scenarios/beam-degradation.json

copilot:
  image:
    repository: orbitops/copilot-api
    tag: "0.1.1-dev-g6g7g8"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8001
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  llm:
    provider: mock
    openaiBaseUrl: ""
    openaiModel: ""

# Phase H.2 — UI / Prometheus / Grafana templates added 2026-05-02 to bring
# the Helm chart in line with the Kustomize overlay (was drifted: chart only
# shipped emulator + copilot, while the overlay shipped 5 services).

ui:
  enabled: true
  image:
    repository: orbitops/digital-twin-ui
    # UI image was NOT bumped in PR #35 (no UI code changed in PR #34); the
    # Phase F UI button (PR #42) was rebuilt locally over 0.1.0-dev rather
    # than tag-bumped. Sprint-2 will revisit + may bump alongside Recharts.
    tag: "0.1.0-dev"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 80
  resources:
    requests: { cpu: "20m",  memory: "32Mi" }
    limits:   { cpu: "200m", memory: "128Mi" }

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v3.5.0
    pullPolicy: IfNotPresent
  service:
    port: 9090
  tsdbRetention: 24h
  dataSizeLimit: 1Gi
  # The chart does NOT render the Prometheus config ConfigMap — it's
  # generated by `kustomize` from `observability/prometheus/prometheus.yml`.
  # For Helm-only deploys, `kubectl apply` the ConfigMap before
  # `helm install`. Sprint-2 may vendor the config into this chart.
  configMapName: orbitops-prometheus-config
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: 11.4.0
    pullPolicy: IfNotPresent
  service:
    port: 3000
  dataSizeLimit: 256Mi
  # Sprint-1 demo defaults — anonymous Viewer + admin/admin. SAFE ONLY for
  # the local-overlay deploy (see deploy/k8s/base/grafana-deployment.yaml
  # comment block). Sprint-2 hardening tracked at
  # docs/reviews/security-review.md S-3 (admin creds → Secret;
  # anonymous → off in non-local).
  admin:
    user: admin
    password: admin
  anonymous:
    enabled: true
    orgRole: Viewer
  # Provisioning + dashboard ConfigMaps come from `observability/grafana/{
  # provisioning,dashboards}/` via Kustomize configMapGenerator. Helm-only
  # deploys must `kubectl apply` them first.
  configMaps:
    provisioning: orbitops-grafana-provisioning
    dashboards:   orbitops-grafana-dashboards
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "300m", memory: "256Mi" }
