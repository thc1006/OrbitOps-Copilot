global:
  namespace: orbitops

emulator:
  image:
    repository: orbitops/ntn-metrics-emulator
    # PR #35 bumped both emulator + copilot to this tag (G6/G7/G8 sprint-1 spec parity).
    # Helm chart was drifted at 0.0.1-dev pre-PR-G; aligned here.
    tag: "0.1.1-dev-g6g7g8"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8000
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  scenario:
    path: /scenarios/beam-degradation.json

copilot:
  image:
    repository: orbitops/copilot-api
    tag: "0.1.1-dev-g6g7g8"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8001
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  llm:
    provider: mock
    openaiBaseUrl: ""
    openaiModel: ""
