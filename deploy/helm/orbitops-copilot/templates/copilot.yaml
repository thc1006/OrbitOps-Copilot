{{- if .Values.copilot.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbitops.fullname" . }}-copilot
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.copilot.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-api
    spec:
      containers:
        - name: copilot
          image: "{{ .Values.copilot.image.repository }}:{{ .Values.copilot.image.tag }}"
          imagePullPolicy: {{ .Values.copilot.image.pullPolicy }}
          ports: [{ containerPort: 8001, name: http }]
          # PR #47 review: parity with deploy/k8s/base/copilot-deployment.yaml.
          # Without ORBITOPS_EMULATOR_METRICS_URL, _retrieval.py falls back
          # to NullScraper and EVERY /ask returns INSUFFICIENT_EVIDENCE
          # (i.e. the chart-deployed copilot was non-functional). Without
          # CORS_ALLOWED_ORIGINS, browser calls from unlisted origins are
          # rejected. The emulator URL uses a bare hostname so kubernetes'
          # DNS search-domain expansion resolves it to the chart's
          # release-prefixed Service automatically — but only if the
          # release name + namespace let DNS reach the right Service.
          # NOTE (PR #47 review #47-3/4/5): the bare hostname
          # `ntn-metrics-emulator` will NOT match this chart's
          # release-prefixed Service name (e.g.
          # `<release>-orbitops-copilot-emulator`). For a Helm-only deploy
          # to actually wire up, override
          # `copilot.emulatorMetricsUrl` to the rendered Service DNS.
          # Sprint-2 architectural fix: either drop the release prefix on
          # Services or template the ConfigMaps. ADR pending.
          env:
            - { name: COPILOT_LLM_PROVIDER,         value: {{ .Values.copilot.llm.provider | quote }} }
            - { name: ORBITOPS_EMULATOR_METRICS_URL, value: {{ .Values.copilot.emulatorMetricsUrl | quote }} }
            - { name: CORS_ALLOWED_ORIGINS,          value: {{ .Values.copilot.corsAllowedOrigins | quote }} }
          resources:
{{ toYaml .Values.copilot.resources | indent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbitops.fullname" . }}-copilot
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: copilot-api }
  ports:
    - { name: http, port: {{ .Values.copilot.service.port }}, targetPort: 8001 }
{{- end -}}
