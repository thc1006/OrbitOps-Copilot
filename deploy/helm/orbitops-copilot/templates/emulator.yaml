{{- if .Values.emulator.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbitops.fullname" . }}-emulator
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.emulator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ntn-metrics-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntn-metrics-emulator
    spec:
      containers:
        - name: emulator
          image: "{{ .Values.emulator.image.repository }}:{{ .Values.emulator.image.tag }}"
          imagePullPolicy: {{ .Values.emulator.image.pullPolicy }}
          ports: [{ containerPort: 8000, name: http }]
          # PR #47 review: parity with deploy/k8s/base/emulator-deployment.yaml.
          # Without ORBITOPS_SCENARIO_PATH the emulator boots without a
          # default scenario; without CORS_ALLOWED_ORIGINS browser calls from
          # an unlisted origin get rejected. Sprint-1 demo defaults below
          # match the local-overlay Kustomize manifest.
          env:
            - { name: ORBITOPS_SCENARIO_PATH, value: {{ .Values.emulator.scenario.path | quote }} }
            - { name: CORS_ALLOWED_ORIGINS,   value: {{ .Values.emulator.corsAllowedOrigins | quote }} }
          volumeMounts:
            - { name: scenarios, mountPath: /scenarios, readOnly: true }
          resources:
{{ toYaml .Values.emulator.resources | indent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        # NB: the scenarios ConfigMap is NOT rendered by this chart — it's
        # generated by Kustomize's configMapGenerator from
        # `packages/scenarios/*.json`. Helm-only deploys must
        # `kubectl apply -f` (or kustomize-render) the ConfigMap first.
        - name: scenarios
          configMap:
            name: {{ .Values.emulator.scenario.configMapName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbitops.fullname" . }}-emulator
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: ntn-metrics-emulator }
  ports:
    - { name: http, port: {{ .Values.emulator.service.port }}, targetPort: 8000 }
{{- end -}}
