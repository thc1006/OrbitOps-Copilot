apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbitops.fullname" . }}-emulator
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.emulator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ntn-metrics-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntn-metrics-emulator
    spec:
      containers:
        - name: emulator
          image: "{{ .Values.emulator.image.repository }}:{{ .Values.emulator.image.tag }}"
          imagePullPolicy: {{ .Values.emulator.image.pullPolicy }}
          ports: [{ containerPort: 8000, name: http }]
          resources:
{{ toYaml .Values.emulator.resources | indent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbitops.fullname" . }}-emulator
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: ntn-metrics-emulator }
  ports:
    - { name: http, port: {{ .Values.emulator.service.port }}, targetPort: 8000 }
