{{- if .Values.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbitops.fullname" . }}-ui
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: digital-twin-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digital-twin-ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports: [{ containerPort: 80, name: http }]
          resources:
{{ toYaml .Values.ui.resources | indent 12 }}
          # /healthz served by nginx.conf (cheaper than rendering index.html
          # on every probe). Mirrors deploy/k8s/base/ui-deployment.yaml.
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbitops.fullname" . }}-ui
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: digital-twin-ui }
  ports:
    - { name: http, port: {{ .Values.ui.service.port }}, targetPort: 80 }
{{- end -}}
