{{- if .Values.prometheus.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbitops.fullname" . }}-prometheus
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: orbitops-copilot
    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.prometheus.tsdbRetention }}"
            - "--web.enable-lifecycle"
          ports: [{ containerPort: 9090, name: http }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data,   mountPath: /prometheus }
          resources:
{{ toYaml .Values.prometheus.resources | indent 12 }}
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        # NB: the ConfigMap `{{ .Values.prometheus.configMapName }}` is NOT
        # rendered by this chart — it's expected to be created out-of-band
        # (the Kustomize overlay generates it from observability/prometheus/
        # prometheus.yml via configMapGenerator). For Helm-only deployments,
        # apply the ConfigMap via `kubectl apply -f` before `helm install`.
        - name: config
          configMap:
            name: {{ .Values.prometheus.configMapName }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.prometheus.dataSizeLimit }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbitops.fullname" . }}-prometheus
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: http, port: {{ .Values.prometheus.service.port }}, targetPort: 9090 }
{{- end -}}
