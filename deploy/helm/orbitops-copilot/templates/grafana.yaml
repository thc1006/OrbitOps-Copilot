{{- if .Values.grafana.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbitops.fullname" . }}-grafana
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: orbitops-copilot
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          # Sprint-1 demo defaults (admin/admin + anonymous Viewer). SAFE
          # ONLY for the local-overlay deploy. Sprint-2 hardening tracked
          # in docs/reviews/security-review.md S-3.
          env:
            - { name: GF_SECURITY_ADMIN_USER,     value: {{ .Values.grafana.admin.user | quote }} }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: {{ .Values.grafana.admin.password | quote }} }
            - { name: GF_USERS_ALLOW_SIGN_UP,     value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED,  value: {{ .Values.grafana.anonymous.enabled | quote }} }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: {{ .Values.grafana.anonymous.orgRole | quote }} }
          ports: [{ containerPort: 3000, name: http }]
          volumeMounts:
            - { name: provisioning-datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: provisioning-dashboards,  mountPath: /etc/grafana/provisioning/dashboards,  readOnly: true }
            - { name: dashboards,               mountPath: /var/lib/grafana/dashboards,           readOnly: true }
            - { name: data,                     mountPath: /var/lib/grafana }
          resources:
{{ toYaml .Values.grafana.resources | indent 12 }}
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        # NB: neither ConfigMap is rendered by this chart.
        # - `orbitops-grafana-provisioning` is checked-in
        #   `deploy/k8s/base/grafana-configmap.yaml` (kustomize `resources:`).
        # - `orbitops-grafana-dashboards` is the ONLY ConfigMap that's
        #   actually `configMapGenerator`-backed (from
        #   `observability/grafana/dashboards/*.json`).
        # For Helm-only deployments, render the kustomize base
        # (`kustomize build deploy/k8s/base`) and `kubectl apply -f` both
        # ConfigMaps before `helm install`.
        - name: provisioning-datasources
          configMap:
            name: {{ .Values.grafana.configMaps.provisioning }}
            items: [{ key: datasource.yaml, path: prometheus.yaml }]
        - name: provisioning-dashboards
          configMap:
            name: {{ .Values.grafana.configMaps.provisioning }}
            items: [{ key: dashboard-provider.yaml, path: orbitops.yaml }]
        - name: dashboards
          configMap:
            name: {{ .Values.grafana.configMaps.dashboards }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.grafana.dataSizeLimit }}
---
apiVersion: v1
kind: Service
metadata:
  # ADR-009: bare Service name mirrors Kustomize / compose contract.
  name: grafana
  labels:
    {{- include "orbitops.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - { name: http, port: {{ .Values.grafana.service.port }}, targetPort: 3000 }
{{- end -}}
